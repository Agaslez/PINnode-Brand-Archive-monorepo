name: CI - Backend Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io

jobs:
  # ==================== LINTING & FORMATTING ====================
  lint:
    name: ESLint & Prettier Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

  # ==================== TYPE CHECKING ====================
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run check

  # ==================== UNIT TESTS ====================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      NODE_ENV: test
      PORT: 5001
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
      JWT_SECRET: test-secret-key-with-32-minimum-chars-required!!!
      SESSION_SECRET: test-session-secret-with-32-minimum-chars-required!!!
      ENCRYPTION_KEY: test-encryption-key-32-minimum-chars-required!!!
      DEEPSEEK_API_KEY: test-key
      OPENAI_API_KEY: test-key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true

  # ==================== BUILD ====================
  build:
    name: Build Backend Bundle
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/
          retention-days: 1

  # ==================== HEALTH CHECK ====================
  health-check:
    name: Health Check & Server Smoke Test
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      NODE_ENV: development
      PORT: 5001
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
      JWT_SECRET: test-secret-key-with-32-minimum-chars-required!!!
      SESSION_SECRET: test-session-secret-with-32-minimum-chars-required!!!
      ENCRYPTION_KEY: test-encryption-key-32-minimum-chars-required!!!
      DEEPSEEK_API_KEY: test-key
      OPENAI_API_KEY: test-key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start server
        run: |
          NODE_ENV=development npm start > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid

      - name: Wait for server with retry loop (30s max)
        run: |
          MAX_ATTEMPTS=30
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            if curl -f http://localhost:5001/api/health 2>/dev/null; then
              echo "✅ Server is healthy"
              exit 0
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Attempt $ATTEMPT/$MAX_ATTEMPTS - retrying..."
            fi
          done
          echo "❌ Server failed to become healthy after 30 seconds"
          echo "Server logs:"
          cat /tmp/server.log
          exit 1

      - name: Cleanup server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) 2>/dev/null || true
          fi

  # ==================== SECURITY ====================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate

  # ==================== SUMMARY ====================
  ci-summary:
    name: CI Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, health-check, security]
    if: always()
    steps:
      - name: ✅ All checks passed
        if: |
          needs.lint.result == 'success' &&
          needs.typecheck.result == 'success' &&
          needs.test.result == 'success' &&
          needs.build.result == 'success' &&
          needs.health-check.result == 'success'
        run: echo "✅ CI Pipeline Passed - Ready to merge"

      - name: ❌ CI Pipeline Failed
        if: |
          needs.lint.result == 'failure' ||
          needs.typecheck.result == 'failure' ||
          needs.test.result == 'failure' ||
          needs.build.result == 'failure' ||
          needs.health-check.result == 'failure'
        run: |
          echo "❌ CI Pipeline Failed"
          exit 1

  # ==================== DEPLOYMENT (Main Branch Only) ====================
  deploy-staging:
    name: Deploy to Render (Staging)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST \
            https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }} \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -d "{\"clearCache\": true}"

  deploy-production:
    name: Deploy to Render (Production)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy (Production)
        run: |
          curl -X POST \
            https://api.render.com/deploy/srv-${{ secrets.RENDER_PROD_SERVICE_ID }} \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -d "{\"clearCache\": true}"
