# Render.com deployment configuration for PINnode Backend
services:
  - type: web
    name: pinnode-backend
    env: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: pinnode-db
          property: connectionString
      - key: DEEPSEEK_API_KEY
        sync: false
    healthCheckPath: /api/health
    
databases:
  - name: pinnode-db
    databaseName: pinnode
    user: pinnode_user
    plan: starter

# Additional services for future scaling
staticSites:
  - name: pinnode-docs
    buildCommand: npm run build:docs
    publishPath: docs/dist
    pullRequestPreviewsEnabled: true