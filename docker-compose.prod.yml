version: '3.8'

# ==========================================
# PINnode Complete Stack - Docker Compose
# Frontend + Backend + Redis + Database
# ==========================================

services:
  # ==========================================
  # Redis - Job Queue & Caching
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: pinnode-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pinnode-network
    command: redis-server --appendonly yes

  # ==========================================
  # Backend API Server
  # ==========================================
  backend:
    build:
      context: ./
      dockerfile: Dockerfile.backend.prod
    container_name: pinnode-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=sqlite:./data/pinnode.db
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - pinnode-network
    restart: unless-stopped

  # ==========================================
  # Frontend React Application
  # ==========================================
  frontend:
    build:
      context: ./
      dockerfile: Dockerfile.frontend.prod
    container_name: pinnode-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REACT_APP_API_URL=http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - pinnode-network
    restart: unless-stopped

  # ==========================================
  # Nginx Reverse Proxy (Optional)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: pinnode-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - pinnode-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ==========================================
# Networks
# ==========================================
networks:
  pinnode-network:
    driver: bridge

# ==========================================
# Volumes
# ==========================================
volumes:
  redis-data:
    driver: local
  backend-data:
    driver: local
  backend-logs:
    driver: local
