version: '3.8'

services:
  # Backend Express API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pinnode-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - FRONTEND_URL=http://localhost:3000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    networks:
      - pinnode-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Vite + React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pinnode-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pinnode-network

networks:
  pinnode-network:
    driver: bridge

volumes:
  backend-data:
  backend-logs:
