name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  client:
    name: Client (lint, type-check, test, build)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Lint
        run: pnpm lint --filter='client'
      
      - name: Type check
        run: pnpm check --filter='client'
      
      - name: Test
        run: pnpm test --filter='client'
      
      - name: Build
        run: pnpm build:client

  server:
    name: Server (lint, type-check, test, build)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Lint
        run: pnpm lint --filter='server'
      
      - name: Type check
        run: pnpm check --filter='server'
      
      - name: Test
        run: pnpm test --filter='server'
      
      - name: Build
        run: pnpm build:server

  smoke-test:
    name: Smoke Test (Docker)
    runs-on: ubuntu-latest
    needs: [ client, server ]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Docker
        run: |
          docker --version
          docker-compose --version
      
      - name: Build Docker images
        run: docker-compose -f docker-compose.yml build
      
      - name: Start services
        run: docker-compose -f docker-compose.yml up -d
      
      - name: Wait for services
        run: sleep 10
      
      - name: Health check - Backend
        run: |
          curl -f http://localhost:5000/health || exit 1
      
      - name: Health check - Frontend
        run: |
          curl -f http://localhost:5173/ || exit 1
      
      - name: Cleanup
        if: always()
        run: docker-compose -f docker-compose.yml down
