name: CI - Quality Gate (FAST)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: 20
  

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies (root)
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Check Prettier formatting
        run: npm run format:check

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies (root)
        run: npm ci
      
      - name: Run TypeScript check
        run: npm run check

  test:
    name: Tests + Smoke (/health)
    runs-on: ubuntu-latest
    
    env:
      NODE_ENV: test
      PORT: 5001
      DATABASE_URL: sqlite:./test.db
      SENTRY_DSN: ""
      JWT_SECRET: test-secret-key-with-32-minimum-chars-required!!!
      SESSION_SECRET: test-session-secret-with-32-minimum-chars-required!!!
      COOKIE_SECRET: test-cookie-secret-with-32-minimum-chars-required!
    
    steps:
      - uses: actions/checkout@v4
      
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies (root)
        run: npm ci
      
      - name: Run unit tests
        run: npm run test
        timeout-minutes: 8
      
      - name: Build server (for smoke test)
        run: npm run build:server
      
      # Smoke: CI start (bez watchera)
      - name: Start server (background)
        run: |
          cd server
          npm run start:ci > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
      
      - name: Wait for /health (retry, max 30s)
        run: |
          MAX_ATTEMPTS=30
          ATTEMPT=0
          until [ $ATTEMPT -ge $MAX_ATTEMPTS ]
          do
            if curl -fsS "http://localhost:${PORT}/health" > /dev/null; then
              echo "✅ Server is healthy"
              exit 0
            fi
            ATTEMPT=$((ATTEMPT+1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS - waiting..."
            sleep 1
          done
          
          echo "❌ Server failed health check"
          echo "---- server.log ----"
          cat /tmp/server.log || true
          exit 1
      
      - name: Cleanup server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill "$(cat /tmp/server.pid)" 2>/dev/null || true
          fi
      
      - name: Upload coverage reports
        if: always()
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  security:
    name: Security Audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies (root)
        run: npm ci
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies (root)
        run: npm ci
      
      - name: Build client
        run: npm run build:client
      
      - name: Build server
        run: npm run build:server

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security, build]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "lint:      ${{ needs.lint.result }}"
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "test:      ${{ needs.test.result }}"
          echo "security:  ${{ needs.security.result }}"
          echo "build:     ${{ needs.build.result }}"
          
          if [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.typecheck.result }}" == "failure" ]] || \
             [[ "${{ needs.test.result }}" == "failure" ]] || \
             [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ CI Pipeline Failed"
            exit 1
          fi
          
          echo "✅ CI Pipeline Passed"
