version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.prod
    container_name: pinnode-backend
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: '5000'
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app/server
      - ./shared:/app/shared
    networks:
      - pinnode-network
    healthcheck:
      test: [ 'CMD', 'curl', '-f', 'http://localhost:5000/health' ]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.prod
    container_name: pinnode-frontend
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./client:/app/client
    networks:
      - pinnode-network
    healthcheck:
      test: [ 'CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:5173' ]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: pinnode-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - pinnode-network
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis-data:

networks:
  pinnode-network:
    driver: bridge